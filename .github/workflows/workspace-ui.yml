name: Workspace UI regression

on:
  push:
    branches:
      - workspace-redesign-v1
      - workspace-simplify-v2
      - workspace-detail-v3
      - workspace-polish-v4
      - ui-visual-audit-v5
      - main
    paths:
      - "index.html"
      - "engine.html"
      - "benchmarks/**"
      - ".github/workflows/workspace-ui.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          for src,out in [('index.html','/tmp/workspace.js'),('engine.html','/tmp/engine.js'),('benchmarks/index.html','/tmp/bench.js')]:
              text=Path(src).read_text(encoding='utf-8')
              scripts=re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
              if not scripts:
                  raise SystemExit(f'no script in {src}')
              Path(out).write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/workspace.js
          node --check /tmp/engine.js
          node --check /tmp/bench.js

      - name: Headless workspace and benchmark
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$BROWSER" --version
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/workspace-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=30000 --dump-dom http://127.0.0.1:8000/ > /tmp/root.html
          grep -q 'data-app-status="ready"' /tmp/root.html
          grep -q "Flowsheet - Main" /tmp/root.html
          grep -q "Model Explorer" /tmp/root.html
          grep -q "READY" /tmp/root.html
          grep -q "Aramco GP" /tmp/root.html
          grep -q "R-101 · CRACKER + TLE" /tmp/root.html
          grep -q "C-101 · COMPRESSION" /tmp/root.html
          grep -q "RECYCLE C2H6" /tmp/root.html
          grep -q "Block Properties" /tmp/root.html
          grep -q "CAN-101 · REACTION PRODUCT SLATE" /tmp/root.html
          grep -q "RECYCLE C2H6" /tmp/root.html
          grep -q "menu-file" /tmp/root.html
          grep -q "Stream Properties" /tmp/root.html
          grep -q "ask.yeonsu@gmail.com" /tmp/root.html
          grep -q "The reactor outlet composition sets the ethane recycle" /tmp/root.html
          grep -q "pfdlines" /tmp/root.html
          if grep -q ">Empirical<" /tmp/root.html; then echo "Empirical control leaked into simplified UI"; exit 1; fi
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=30000 --dump-dom http://127.0.0.1:8000/benchmarks/ > /tmp/bench.html
          grep -q 'data-benchmark-status="complete"' /tmp/bench.html
          grep -q 'data-benchmark-count="3"' /tmp/bench.html

      - name: Capture rendered workspace
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --hide-scrollbars             --window-size=1440,900 --virtual-time-budget=30000             --screenshot=/tmp/workspace-1440.png http://127.0.0.1:8000/
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --hide-scrollbars             --window-size=1920,1080 --virtual-time-budget=30000             --screenshot=/tmp/workspace-1920.png http://127.0.0.1:8000/
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --hide-scrollbars             --window-size=1440,900 --virtual-time-budget=30000             --screenshot=/tmp/benchmarks-1440.png http://127.0.0.1:8000/?case=Chen%202024&T=950&tau=0.124&steam=0.2&P=1&n=1
          mkdir -p ui-audit
          cp /tmp/workspace-1440.png /tmp/workspace-1920.png /tmp/benchmarks-1440.png ui-audit/

      - uses: actions/upload-artifact@v4
        with:
          name: workspace-screenshots-${{ github.run_id }}
          path: ui-audit/*.png
          retention-days: 14

      - name: Verify API passthrough
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('index.html').read_text(encoding='utf-8')
          assert 'window.ethaneModel=api' in text
          assert 'src="engine.html"' in text
          print('workspace shell delegates to engine.html and preserves benchmark API')
          PY
