<!doctype html><html><meta charset="utf-8"><title>Calibration API regressions</title>
<body data-calibration-status="running"><pre id="result">Waiting for engine</pre><iframe id="engine" src="../engine.html" hidden></iframe>
<script type="module">
import {testEngine} from './browser-tests.mjs';
try{
 let api;
 for(let i=0;i<300;i++){api=document.getElementById('engine').contentWindow.ethaneModel;if(api?.ready())break;await new Promise(r=>setTimeout(r,50));}
 if(!api?.ready())throw Error('Engine did not become ready');
 const result=testEngine(api);document.getElementById('result').textContent=JSON.stringify(result);document.body.dataset.calibrationStatus='pass';
}catch(e){document.getElementById('result').textContent=e.stack;document.body.dataset.calibrationStatus='fail';}
</script></body></html>
